# harvest-env — eval-harvest's packaged Lambda MicroVMs Harbor environment.
#
# A separate distribution, installed as an editable path dependency of the root package's `eval`
# dependency group. It exists so an unmodified Harbor can import
# `harvest_env.lambda_microvms:LambdaMicrovmsEnvironment` by import path (H-3), rather than through
# the `harbor[lambda-microvms]` extra (which does not exist on PyPI Harbor) or a PYTHONPATH overlay
# of the `harbor.*` namespace (which cannot work).

[project]
name = "harvest-env"
version = "0.1.0"
description = "eval-harvest's packaged Lambda MicroVMs Harbor environment, loaded into an unmodified Harbor by import path."
requires-python = ">=3.12"
# microvms owns builds, AWS lifecycle, and guest execution. boto3 supplies the credential/service
# preflight (the lambda-microvms model first shipped in 1.43.35). Harbor's environment-definition
# machinery imports dockerfile-parse at construction time. Keep the SDK exact so its provisioned
# daemon and the high-level API remain a tested pair.
dependencies = [
  # Pinned exactly: this environment imports Harbor internals, so a newer Harbor could move those
  # under it.
  "harbor==0.22.0",
  "microvms==0.11.0",
  "boto3>=1.43.35",
  "dockerfile-parse>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_env"]
